[package]
name = "vortex-gtk"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "vortex"
path = "src/main.rs"

[dependencies]
vortex-core = { path = "../vortex-core" }
gtk4 = { version = "0.11.5", features = ["v4_14"] }
libadwaita = { version = "0.9.2", features = ["v1_6"] }
rustix = { version = "1.1.6", features = ["process"] }

[lints]
workspace = true
